<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-health" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F7FAF7"/>
      <stop offset="100%" stop-color="#EAF2EB"/>
    </linearGradient>
    <radialGradient id="eye-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFDD55" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#439A67" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1D5F3C" stop-opacity="0"/>
    </radialGradient>
    <filter id="health-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1C201A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background Ground -->
  <rect width="1200" height="675" fill="url(#bg-grad-health)"/>

  <!-- Border with leaf green and medical/seva cross corners -->
  <rect x="24" y="24" width="1152" height="627" fill="none" stroke="#1D5F3C" stroke-width="3"/>
  <rect x="36" y="36" width="1128" height="603" fill="none" stroke="#E8862E" stroke-width="1.5" stroke-dasharray="10 5"/>

  <!-- Corner Healing Crosses -->
  <g fill="#1D5F3C">
    <!-- Top-left -->
    <path d="M55 45 H65 V55 H75 V65 H65 V75 H55 V65 H45 V55 H55 Z"/>
    <!-- Top-right -->
    <path d="M1145 45 H1155 V55 H1165 V65 H1155 V75 H1145 V65 H1135 V55 H1145 Z"/>
    <!-- Bottom-left -->
    <path d="M55 605 H65 V615 H75 V625 H65 V635 H55 V625 H45 V615 H55 Z"/>
    <!-- Bottom-right -->
    <path d="M1145 605 H1155 V615 H1165 V625 H1155 V635 H1145 V625 H1135 V615 H1145 Z"/>
  </g>

  <!-- Arch Frame -->
  <path d="M300 580 V300 C300 160 430 80 600 50 C770 80 900 160 900 300 V580" fill="none" stroke="#1D5F3C" stroke-width="5" stroke-linecap="round"/>
  <path d="M340 580 V310 C340 190 450 120 600 95 C750 120 860 190 860 310 V580" fill="#FFFDF7" stroke="#E8862E" stroke-width="2" filter="url(#health-shadow)"/>

  <!-- Radiant Light of Sight behind Eye -->
  <circle cx="600" cy="285" r="160" fill="url(#eye-glow)"/>

  <!-- Central Symbol: Eye of Vision & Light (ನೇತ್ರದಾನ) -->
  <g id="eye-symbol" transform="translate(600, 275)" filter="url(#health-shadow)">
    <!-- Eye Outer Almond Contour -->
    <path d="M-150 0 C-90 -90 90 -90 150 0 C90 90 -90 90 -150 0 Z" fill="#FFFDF7" stroke="#1D5F3C" stroke-width="7" stroke-linejoin="round"/>
    
    <!-- Outer Iris Ring in Leaf Green -->
    <circle cx="0" cy="0" r="58" fill="#2E7D4E" stroke="#1D5F3C" stroke-width="4"/>
    
    <!-- Radiant Iris Lines -->
    <circle cx="0" cy="0" r="48" fill="#1D5F3C"/>
    <circle cx="0" cy="0" r="28" fill="#FFFDF7"/>
    <!-- Pupil radiating golden light -->
    <circle cx="0" cy="0" r="18" fill="#E8862E"/>
    <!-- Eye Sparkle / Light reflection -->
    <circle cx="-8" cy="-8" r="6" fill="#FFFDF7"/>

    <!-- Radiant Rays of Sight extending from eye -->
    <g stroke="#E8862E" stroke-width="2.5" stroke-linecap="round">
      <line x1="0" y1="-85" x2="0" y2="-115"/>
      <line x1="-70" y1="-75" x2="-95" y2="-100"/>
      <line x1="70" y1="-75" x2="95" y2="-100"/>
      <line x1="-120" y1="-45" x2="-155" y2="-60"/>
      <line x1="120" y1="-45" x2="155" y2="-60"/>
    </g>
  </g>

  <!-- Cupping Caring Hands (ಹಸ್ತ / Seva & Protection) below -->
  <g id="cupping-hands" transform="translate(600, 395)" filter="url(#health-shadow)">
    <!-- Left Caring Hand Silhouette -->
    <path d="M-180 50 C-140 10 -60 15 -20 10 C-40 40 -80 60 -140 70 Z" fill="#E8862E" opacity="0.9"/>
    <!-- Right Caring Hand Silhouette -->
    <path d="M180 50 C140 10 60 15 20 10 C40 40 80 60 140 70 Z" fill="#E8862E" opacity="0.9"/>

    <!-- Blooming Lotus of Health and Life resting in hands -->
    <g fill="#C03A2B" stroke="#1D5F3C" stroke-width="2">
      <!-- Center Petal -->
      <path d="M0 -15 C-18 -45 0 -75 0 -75 C0 -75 18 -45 0 -15 Z" fill="#C03A2B"/>
      <!-- Inner side petals -->
      <path d="M0 -15 C-30 -35 -35 -65 -35 -65 C-20 -50 0 -35 0 -15 Z" fill="#D94E3E"/>
      <path d="M0 -15 C30 -35 35 -65 35 -65 C20 -50 0 -35 0 -15 Z" fill="#D94E3E"/>
      <!-- Outer side petals -->
      <path d="M0 -10 C-45 -20 -55 -45 -55 -45 C-35 -35 -15 -25 0 -10 Z" fill="#E8862E"/>
      <path d="M0 -10 C45 -20 55 -45 55 -45 C35 -35 15 -25 0 -10 Z" fill="#E8862E"/>
    </g>
  </g>

  <!-- Banner at Bottom -->
  <g transform="translate(600, 520)">
    <rect x="-350" y="0" width="700" height="54" rx="27" fill="#1D5F3C" filter="url(#health-shadow)"/>
    <rect x="-342" y="5" width="684" height="44" rx="22" fill="none" stroke="#E8862E" stroke-width="2"/>

    <text x="0" y="34" text-anchor="middle" fill="#FFFDF7" font-family="'Noto Sans Kannada', 'Segoe UI', sans-serif" font-size="22" font-weight="800" letter-spacing="1">
      ನೇತ್ರದಾನ ಜಾಗೃತಿ ಮತ್ತು ಆರೋಗ್ಯ ಸೇವೆ
    </text>
  </g>

  <!-- Inspiring Motto line -->
  <text x="600" y="615" text-anchor="middle" fill="#1D5F3C" font-family="'Noto Sans Kannada', 'Segoe UI', sans-serif" font-size="16" font-weight="700">
    “ನಮ್ಮ ಕಣ್ಣುಗಳು ಮತ್ತೊಬ್ಬರ ಬದುಕಿನಲ್ಲಿ ಬೆಳಕಾಗಲಿ” · ಉಚಿತ ಆರೋಗ್ಯ ಮತ್ತು ಯೋಗ ಶಿಬಿರಗಳು
  </text>
</svg>
