<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-journey" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FDFBF5"/>
      <stop offset="100%" stop-color="#F2E6CE"/>
    </linearGradient>
    <linearGradient id="gold-leaf-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFDD66"/>
      <stop offset="100%" stop-color="#E8862E"/>
    </linearGradient>
    <filter id="vector-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1C201A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background Ground -->
  <rect width="1200" height="675" fill="url(#bg-grad-journey)"/>

  <!-- Outer Double Line Border -->
  <rect x="24" y="24" width="1152" height="627" fill="none" stroke="#1D5F3C" stroke-width="3"/>
  <rect x="34" y="34" width="1132" height="607" fill="none" stroke="#E8862E" stroke-width="1.5" stroke-dasharray="10 5"/>

  <!-- Left Kadali (Plantain / Banana Leaf) Motif -->
  <g transform="translate(60, 60)" filter="url(#vector-shadow)">
    <!-- Main stem -->
    <path d="M70 540 Q130 320 220 120" fill="none" stroke="#1D5F3C" stroke-width="8" stroke-linecap="round"/>
    <!-- Large arching banana leaves -->
    <path d="M70 540 C40 380 90 240 220 120 C180 200 160 380 70 540 Z" fill="#2E7D4E" opacity="0.85"/>
    <path d="M120 400 C180 320 240 220 300 150 C260 220 220 310 120 400 Z" fill="#1D5F3C" opacity="0.9"/>
    <path d="M90 480 C130 420 170 330 240 260 C200 340 160 410 90 480 Z" fill="#439A67" opacity="0.8"/>
    <!-- Kasuti vein lines -->
    <line x1="120" y1="360" x2="160" y2="330" stroke="#FFFDF7" stroke-width="2" stroke-linecap="round"/>
    <line x1="140" y1="300" x2="190" y2="265" stroke="#FFFDF7" stroke-width="2" stroke-linecap="round"/>
    <line x1="170" y1="230" x2="230" y2="190" stroke="#FFFDF7" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Right Kadali (Plantain / Banana Leaf) Motif - Mirrored -->
  <g transform="translate(1140, 60) scale(-1, 1)" filter="url(#vector-shadow)">
    <!-- Main stem -->
    <path d="M70 540 Q130 320 220 120" fill="none" stroke="#1D5F3C" stroke-width="8" stroke-linecap="round"/>
    <!-- Large arching banana leaves -->
    <path d="M70 540 C40 380 90 240 220 120 C180 200 160 380 70 540 Z" fill="#2E7D4E" opacity="0.85"/>
    <path d="M120 400 C180 320 240 220 300 150 C260 220 220 310 120 400 Z" fill="#1D5F3C" opacity="0.9"/>
    <path d="M90 480 C130 420 170 330 240 260 C200 340 160 410 90 480 Z" fill="#439A67" opacity="0.8"/>
    <!-- Kasuti vein lines -->
    <line x1="120" y1="360" x2="160" y2="330" stroke="#FFFDF7" stroke-width="2" stroke-linecap="round"/>
    <line x1="140" y1="300" x2="190" y2="265" stroke="#FFFDF7" stroke-width="2" stroke-linecap="round"/>
    <line x1="170" y1="230" x2="230" y2="190" stroke="#FFFDF7" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Center Mandala & Milestone Celebration -->
  <g transform="translate(600, 275)" filter="url(#vector-shadow)">
    <!-- Outer Decorative Radiating Circle -->
    <circle cx="0" cy="0" r="190" fill="none" stroke="#E8862E" stroke-width="2" stroke-dasharray="8 6"/>
    <circle cx="0" cy="0" r="175" fill="#FFFDF7" stroke="#1D5F3C" stroke-width="5"/>
    <circle cx="0" cy="0" r="162" fill="none" stroke="#E8862E" stroke-width="2"/>

    <!-- Decorative 12 Lotus Petals around the circle -->
    <g fill="#F2DDB9" stroke="#1D5F3C" stroke-width="2">
      <path d="M0 -175 Q20 -205 0 -220 Q-20 -205 0 -175 Z"/>
      <path d="M124 -124 Q155 -135 155 -155 Q135 -155 124 -124 Z"/>
      <path d="M175 0 Q205 20 220 0 Q205 -20 175 0 Z"/>
      <path d="M124 124 Q135 155 155 155 Q155 135 124 124 Z"/>
      <path d="M0 175 Q20 205 0 220 Q-20 205 0 175 Z"/>
      <path d="M-124 124 Q-155 135 -155 155 Q-135 155 -124 124 Z"/>
      <path d="M-175 0 Q-205 20 -220 0 Q-205 -20 -175 0 Z"/>
      <path d="M-124 -124 Q-135 -155 -155 -155 Q-155 -135 -124 -124 Z"/>
    </g>

    <!-- Inner Circle Gold Wash -->
    <circle cx="0" cy="0" r="145" fill="#FBF6EB" stroke="#1D5F3C" stroke-width="3"/>

    <!-- Silver Jubilee & Three Decades Typography -->
    <text x="0" y="-60" text-anchor="middle" fill="#C03A2B" font-family="'Noto Sans Kannada', 'Segoe UI', sans-serif" font-size="20" font-weight="700" letter-spacing="2">
      1993 – 2026
    </text>
    
    <text x="0" y="8" text-anchor="middle" fill="#1D5F3C" font-family="'Fraunces', Georgia, serif" font-size="76" font-weight="900" letter-spacing="-1">
      30+
    </text>

    <text x="0" y="46" text-anchor="middle" fill="#E8862E" font-family="'Noto Sans Kannada', 'Segoe UI', sans-serif" font-size="22" font-weight="800">
      ಸಾರ್ಥಕ ವರ್ಷಗಳು
    </text>

    <text x="0" y="82" text-anchor="middle" fill="#1C201A" font-family="'Noto Sans Kannada', 'Segoe UI', sans-serif" font-size="16" font-weight="600">
      ರಜತ ಮಹೋತ್ಸವದ ಸವಿನೆನಪು
    </text>

    <!-- Miniature Diya at bottom of medallion -->
    <path d="M-22 105 Q0 118 22 105 Q15 125 0 128 Q-15 125 -22 105 Z" fill="#E8862E" stroke="#1D5F3C" stroke-width="2"/>
    <circle cx="0" cy="98" r="4.5" fill="#C03A2B"/>
  </g>

  <!-- Bottom Arch & Banner -->
  <g transform="translate(600, 560)">
    <!-- Kasuti Ribbon Banner -->
    <rect x="-320" y="0" width="640" height="52" rx="26" fill="#1D5F3C" filter="url(#vector-shadow)"/>
    <rect x="-312" y="5" width="624" height="42" rx="21" fill="none" stroke="#E8862E" stroke-width="2" stroke-dasharray="8 4"/>

    <!-- 3 Core Values in Kannada -->
    <text x="0" y="32" text-anchor="middle" fill="#FFFDF7" font-family="'Noto Sans Kannada', 'Segoe UI', sans-serif" font-size="22" font-weight="700" letter-spacing="3">
      ಸೇವೆ  ✦  ಸಂಸ್ಕೃತಿ  ✦  ಸಬಲೀಕರಣ
    </text>
  </g>

  <!-- Sub-caption line -->
  <text x="600" y="635" text-anchor="middle" fill="#55645A" font-family="'Noto Sans Kannada', 'Segoe UI', sans-serif" font-size="14" font-weight="600">
    ಮೂರು ದಶಕಗಳ ಮಹಿಳಾ ಒಗ್ಗಟ್ಟು ಮತ್ತು ಸೇವಾ ಸಮರ್ಪಣೆಯ ಹೆಮ್ಮೆಯ ಪಯಣ
  </text>
</svg>
