<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-stage" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FBF8EE"/>
      <stop offset="100%" stop-color="#EFE5CE"/>
    </linearGradient>
    <linearGradient id="curtain-grad-l" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#14432A"/>
      <stop offset="70%" stop-color="#1D5F3C"/>
      <stop offset="100%" stop-color="#28734B"/>
    </linearGradient>
    <linearGradient id="curtain-grad-r" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#14432A"/>
      <stop offset="70%" stop-color="#1D5F3C"/>
      <stop offset="100%" stop-color="#28734B"/>
    </linearGradient>
    <filter id="theatre-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#1C201A" flood-opacity="0.16"/>
    </filter>
  </defs>

  <!-- Background Ground -->
  <rect width="1200" height="675" fill="url(#bg-grad-stage)"/>

  <!-- Geometric Border -->
  <rect x="24" y="24" width="1152" height="627" fill="none" stroke="#1D5F3C" stroke-width="3"/>
  <rect x="36" y="36" width="1128" height="603" fill="none" stroke="#E8862E" stroke-width="1.5" stroke-dasharray="10 5"/>

  <!-- Theatrical Draped Stage Curtains (Left & Right) -->
  <!-- Left Curtain Drape -->
  <g filter="url(#theatre-shadow)">
    <path d="M36 36 H220 C200 200 130 360 210 520 L36 520 Z" fill="url(#curtain-grad-l)"/>
    <!-- Fold lines on left curtain -->
    <path d="M100 36 Q130 280 80 520" fill="none" stroke="#14432A" stroke-width="3"/>
    <path d="M160 36 Q180 250 140 520" fill="none" stroke="#14432A" stroke-width="3"/>
    <!-- Gold Rope Tieback Left -->
    <path d="M36 360 Q130 380 185 350" fill="none" stroke="#FFDD55" stroke-width="6"/>
    <circle cx="185" cy="350" r="7" fill="#E8862E"/>
    <!-- Gold Fringe Bottom -->
    <line x1="36" y1="520" x2="210" y2="520" stroke="#FFDD55" stroke-width="5" stroke-dasharray="6 3"/>

    <!-- Right Curtain Drape (Mirrored) -->
    <path d="M1164 36 H980 C1000 200 1070 360 990 520 L1164 520 Z" fill="url(#curtain-grad-r)"/>
    <!-- Fold lines on right curtain -->
    <path d="M1100 36 Q1070 280 1120 520" fill="none" stroke="#14432A" stroke-width="3"/>
    <path d="M1040 36 Q1020 250 1060 520" fill="none" stroke="#14432A" stroke-width="3"/>
    <!-- Gold Rope Tieback Right -->
    <path d="M1164 360 Q1070 380 1015 350" fill="none" stroke="#FFDD55" stroke-width="6"/>
    <circle cx="1015" cy="350" r="7" fill="#E8862E"/>
    <!-- Gold Fringe Bottom -->
    <line x1="990" y1="520" x2="1164" y2="520" stroke="#FFDD55" stroke-width="5" stroke-dasharray="6 3"/>
  </g>

  <!-- Stage Lighting Spotlight Cone -->
  <polygon points="600,36 350,560 850,560" fill="#FFFBE6" opacity="0.35"/>

  <!-- Center Artwork: Palm-leaf Vachana Manuscript & Tambura Silhouette -->
  <g id="center-vachana-art" transform="translate(600, 260)" filter="url(#theatre-shadow)">
    
    <!-- Classical Tambura / Ektara Silhouette in Gold/Brown -->
    <g transform="translate(130, -50) rotate(24)">
      <!-- Gourd Resonator (Kodu) -->
      <circle cx="0" cy="180" r="44" fill="#E8862E" stroke="#1D5F3C" stroke-width="3"/>
      <!-- Neck / Fingerboard (Dandi) -->
      <rect x="-6" y="-70" width="12" height="250" fill="#995D28" stroke="#1D5F3C" stroke-width="2"/>
      <!-- Tuning Pegs (Gullu) -->
      <circle cx="-16" cy="-40" r="6" fill="#1D5F3C"/>
      <circle cx="16" cy="-40" r="6" fill="#1D5F3C"/>
      <!-- Strings -->
      <line x1="-2" y1="-50" x2="-2" y2="180" stroke="#FFDD55" stroke-width="1.5"/>
      <line x1="2" y1="-50" x2="2" y2="180" stroke="#FFDD55" stroke-width="1.5"/>
    </g>

    <!-- Palm-Leaf Manuscript (ತಾಳೆಗರಿ ವಚನ ಸಂಪುಟ) -->
    <g id="talegari-manuscript">
      <!-- Shadow leaf below -->
      <rect x="-190" y="30" width="380" height="60" rx="6" fill="#D4BE8C" stroke="#1D5F3C" stroke-width="2" transform="rotate(-4)"/>
      <!-- Middle leaf -->
      <rect x="-190" y="10" width="380" height="60" rx="6" fill="#E8D5A7" stroke="#1D5F3C" stroke-width="3" transform="rotate(3)"/>
      <!-- Top leaf (sharp and legible) -->
      <rect x="-200" y="-15" width="400" height="64" rx="6" fill="#FFF7DE" stroke="#1D5F3C" stroke-width="4"/>
      
      <!-- Binding Cord Holes & Red Ribbon -->
      <circle cx="-140" cy="17" r="6" fill="#C03A2B" stroke="#1D5F3C" stroke-width="2"/>
      <circle cx="140" cy="17" r="6" fill="#C03A2B" stroke="#1D5F3C" stroke-width="2"/>
      <line x1="-140" y1="-30" x2="-140" y2="60" stroke="#C03A2B" stroke-width="3"/>
      <line x1="140" y1="-30" x2="140" y2="60" stroke="#C03A2B" stroke-width="3"/>

      <!-- Stylized Vachana Text Script Lines on Manuscript -->
      <g stroke="#1D5F3C" stroke-width="2" stroke-linecap="round" opacity="0.8">
        <line x1="-110" y1="2" x2="110" y2="2"/>
        <line x1="-110" y1="17" x2="110" y2="17" stroke-dasharray="14 6 22 8"/>
        <line x1="-110" y1="32" x2="110" y2="32"/>
      </g>
    </g>

    <!-- Sacred Rudraksha Beads garland draped across the manuscript -->
    <g fill="#995D28" stroke="#1D5F3C" stroke-width="1.5">
      <circle cx="-160" cy="80" r="9"/>
      <circle cx="-130" cy="95" r="9"/>
      <circle cx="-95" cy="105" r="9"/>
      <circle cx="-55" cy="112" r="9"/>
      <circle cx="-15" cy="114" r="9"/>
      <circle cx="25" cy="112" r="9"/>
      <circle cx="65" cy="105" r="9"/>
      <circle cx="100" cy="95" r="9"/>
      <circle cx="130" cy="80" r="9"/>
      <!-- Guru bead -->
      <circle cx="-15" cy="126" r="11" fill="#C03A2B"/>
    </g>

    <!-- Traditional Diya / Deepa at foot of manuscript -->
    <g transform="translate(-160, 50)">
      <path d="M-25 0 Q0 16 25 0 Q18 20 0 22 Q-18 20 -25 0 Z" fill="#E8862E" stroke="#1D5F3C" stroke-width="2.5"/>
      <!-- Flame -->
      <path d="M0 -5 C8 -16 6 -28 0 -35 C-6 -28 -8 -16 0 -5 Z" fill="#FFDD55" stroke="#C03A2B" stroke-width="2"/>
      <circle cx="0" cy="-14" r="3" fill="#C03A2B"/>
    </g>
  </g>

  <!-- Banner at Bottom -->
  <g transform="translate(600, 520)">
    <rect x="-350" y="0" width="700" height="54" rx="27" fill="#1D5F3C" filter="url(#theatre-shadow)"/>
    <rect x="-342" y="5" width="684" height="44" rx="22" fill="none" stroke="#E8862E" stroke-width="2"/>

    <text x="0" y="34" text-anchor="middle" fill="#FFFDF7" font-family="'Noto Sans Kannada', 'Segoe UI', sans-serif" font-size="22" font-weight="800" letter-spacing="1">
      ವಚನ ಸಾಹಿತ್ಯ ಮತ್ತು 'ವಚನಯಾನ' ನಾಟಕ
    </text>
  </g>

  <!-- Sub-caption line -->
  <text x="600" y="615" text-anchor="middle" fill="#55645A" font-family="'Noto Sans Kannada', 'Segoe UI', sans-serif" font-size="16" font-weight="600">
    ಶರಣೆ ಅಕ್ಕನಾಗವ್ವ ಹಾಗೂ ಅಕ್ಕಮಹಾದೇವಿ ಅವರ ವಚನ ಸಂದೇಶಗಳನ್ನು ಸಾರುವ ಸಾಂಸ್ಕೃತಿಕ ರಂಗಪ್ರಯೋಗ
  </text>
</svg>
