name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # Full history: the notify step diffs github.event.before..sha to find
        # what this push published (the repo is tiny; the clone stays cheap).
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=kadali --branch=main

      - name: Notify subscribers of new content
        # Best-effort: the script itself exits 0 on configuration or send
        # trouble (runbook: docs/push-notifications.md), but belt and braces —
        # a push outage must never turn a finished deploy red.
        continue-on-error: true
        if: github.event_name == 'push'
        env:
          SITE_ORIGIN: https://kadali.org
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          PUSH_ADMIN_KEY: ${{ secrets.PUSH_ADMIN_KEY }}
        run: node scripts/notify.mjs
